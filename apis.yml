aid: floatme
name: FloatMe
description: 'FloatMe is a US fintech app offering interest-free cash advances ("Floats") to help members
  bridge income gaps between paychecks — new eligible members can request up to $50 and existing members up
  to $100, with no credit check and no reporting to credit bureaus. Beyond advances, FloatMe provides spending
  tracking and insights, low-balance alerts to help avoid overdraft fees, income and cash-flow forecasting,
  and an exclusive marketplace of deals on everyday essentials. The service runs on a $4.99/month membership,
  with optional instant-transfer fees. FloatMe operates a consumer mobile app and website; it does not
  currently publish a public developer API, SDKs, or API documentation.'
